# Host Nginx site for the NA Web intro page.
# Install (replace the domain, or use the server IP until a domain is ready):
#   sed "s/__DOMAIN__/103.77.209.28/" deploy/nginx-introduce.conf > /etc/nginx/sites-available/introduce
#   ln -s /etc/nginx/sites-available/introduce /etc/nginx/sites-enabled/introduce
#   nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name __DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
